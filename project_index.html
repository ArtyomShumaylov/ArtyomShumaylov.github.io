<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма регистрации</title>
    <style>
        .error {
            color: red;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<main>
    <h1>Регистрация</h1>
    <form id="registration-form">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" required>
        <br>
        
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required>
        <br>
        
        <button type="submit">Зарегистрироваться</button>
    </form>

    <div id="error-container"></div>

    <section class="social-media">
        <h2>С нами работают</h2>
        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">Instagram</a>
            <a href="#">LinkedIn</a>
        </div>
    </section>
</main>

<script src="project_form.js"></script>
<script>
document.getElementById('registration-form').addEventListener('submit', function(event) {
    event.preventDefault(); // Предотвращаем стандартное поведение формы

    const formData = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
    };

    fetch('http://yourdomain.com/project_api.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(formData)
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                console.error('Ошибка:', err);
                displayErrors(err.errors || [err.error]);
            });
        }
        
        return response.json();
    })
    .then(result => {
        console.log('Успех:', result.message);
        // Здесь можно добавить логику для перенаправления или отображения успешного сообщения
    })
    .catch(error => {
        console.error('Ошибка сети:', error);
    });

    function displayErrors(errors) {
        const errorContainer = document.getElementById('error-container');
        errorContainer.innerHTML = ''; // Очищаем предыдущие ошибки
        
        errors.forEach(error => {
            const errorElement = document.createElement('div');
            errorElement.className = 'error'; // Добавьте CSS класс для стилизации ошибок
            errorElement.textContent = error;
            errorContainer.appendChild(errorElement);
        });
    }
});
</script>

</body>
</html>
